# Comprobación automática de la app en cada push y pull request:
# todos los archivos compilan (sintaxis) y no hay lookbehind en regex.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sintaxis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Conflictos de versiones heredados (lucide pide React 18; la app usa 19):
      # se instala igual que en local.
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: node scripts/verificar-sintaxis.js
